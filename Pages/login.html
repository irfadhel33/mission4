<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill - Masuk</title>

    <link rel="icon" type="image/x-icon" href="../Images/CHILL.png">
    <link rel="stylesheet" href="../Style/authentication.css">
</head>
<body class="login-bg">
    
    <main>
    
        <!-- Chill Logo -->
        <div class="top-container">
            <img class="logo" src="../Images/movie-open.png" alt="Movie Open">
            <img class="logo-text" src="../Images/CHILL.png" alt="Chill App Logo">
        </div>
        
        <!-- Welcome Message -->
         <div class="welcome-message">
             <h1>Masuk</h1>
             <p>Selamat datang kembali!</p>
         </div>

        <!-- Form -->
        <form action="#" method="post">
            
            <!-- Username Container-->
            <div class="form">
                <label for="username">Username</label>
                <input  
                type="text" 
                id="username" 
                name="username" 
                placeholder="Masukkan username" 
                required>
            </div>

            <!-- Password -->
            <div class="form">
                <label for="password">Kata sandi</label>

                <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Masukkan kata sandi" 
                required>
                <img src="../Images/hidden-pw.png" alt="Show Password">
            </div>

            <!-- Action -->
            <div class="relog-action">
                <p>Belum punya akun? <a href="./register.html">Daftar</a></p>
                <p><a href="#">Lupa Password?</a></p>
            </div>

            <!-- Login Button -->
            <div class="login-button">

                <a class="login" href="./main.html" type="submit">
                    Masuk
                </a>

                <p>Atau</p>
                
                <button class="google-login">
                    <img src="../Images/google-logo.png" alt="Google Logo">
                    Masuk dengan Google
                </button>

            </div>

        </form>
        
    </main>
    
</body>
</html>
