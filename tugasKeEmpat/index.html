<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container" id="app">
      <header class="header">
        <div class="profile">
          <div class="avatar">IF</div>
          <div class="profile-info">
            <h2>Irsyad Fadhel</h2>
            <div class="role">
              <i class="fas fa-briefcase"></i> Manajer Operasional
            </div>
          </div>
        </div>
        <div class="time-display">
          <div class="day" id="dayDisplay">Rabu</div>
          <div class="date" id="dateDisplay">22 Juli 2026</div>
        </div>
      </header>

      <section class="input-section">
        <div class="input-row">
          <div class="input-group" style="flex: 2">
            <label for="taskInput"
              ><i class="fas fa-pen-fancy"></i> Tulis Tugas</label
            >
            <input
              type="text"
              id="taskInput"
              placeholder="Misalnya: Rapat evaluasi proyek ..."
            />
          </div>
          <div class="input-group" style="flex: 1.2">
            <label><i class="fas fa-flag"></i> Level Prioritas</label>
            <div class="priority-group" id="priorityGroup">
              <label class="priority-option low active" data-value="low">
                <input type="radio" name="priority" value="low" checked />
                <span class="dot"></span> Low
              </label>
              <label class="priority-option medium" data-value="medium">
                <input type="radio" name="priority" value="medium" />
                <span class="dot"></span> Medium
              </label>
              <label class="priority-option high" data-value="high">
                <input type="radio" name="priority" value="high" />
                <span class="dot"></span> High
              </label>
            </div>
          </div>
          <button class="submit-btn" id="submitBtn">
            <i class="fas fa-plus-circle"></i> Tambah
          </button>
        </div>
      </section>

      <div class="columns">
        <div class="column">
          <div class="column-header">
            <h3><i class="fas fa-clipboard-list"></i> To Do</h3>
            <span class="badge" id="todoCount">0</span>
          </div>
          <ul class="task-list" id="todoList">
            <!-- <li class="empty-state">
              <i class="fas fa-inbox"></i>
              Belum ada tugas. Yuk tambah!
            </li> -->
          </ul>
        </div>
        <div class="column">
          <div class="column-header">
            <h3><i class="fas fa-check-circle"></i> Done</h3>
            <span class="badge done-badge" id="doneCount">0</span>
          </div>
          <ul class="task-list" id="doneList">
            <!-- <li class="empty-state">
              <i class="fas fa-check-double"></i>
              Belum ada tugas selesai.
            </li> -->
          </ul>
        </div>
      </div>

      <div class="footer-actions">
        <button class="delete-all-btn" id="deleteAllBtn">
          <i class="fas fa-trash-alt"></i> Hapus Semua
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
